# =============================================================================
# sage_kaizen_tuning.conf — tuned PostgreSQL settings for the Sage Kaizen rig
#
# Target host, measured 2026-08-06:
#   PostgreSQL 18.2 (MSVC x64) + pgvector 0.8.1, Windows 11 Pro
#   190 GB RAM, Ryzen 9 9950X3D (16C/32T)
#   Database: 3534 GB.  wiki_chunks alone: 508,359,968 rows / 3503 GB
#   PGDATA on I: — Seagate IronWolf ST12000VN0008, 7200 RPM SATA HDD
#   Idle NVMe available: D: (3.64 TB, empty), E: (3.35 TB free)
#
# THE OPERATING CONSTRAINT THAT SHAPES EVERY VALUE BELOW:
#   This machine reboots uncleanly under sustained load.  Windows Event ID 41
#   fired 9 times between 2026-07-30 and 2026-08-05, and sage_kaizen_ai_ingest
#   CLAUDE.md §18 records a wiki_ingest run dying after 24 minutes with the root
#   cause still open ("PARTIALLY resolved ... It did NOT fix the crashes").
#   So: durability is never traded for speed here, and anything that lengthens
#   crash recovery is bounded.  The usual bulk-load advice (synchronous_commit
#   = off, fsync = off) is ACTIVELY DANGEROUS on this host — a torn 3.5 TB
#   database costs weeks of re-ingest.
#
# HOW TO APPLY
#   1. Append to postgresql.conf, or (preferred) keep it separate:
#        # in postgresql.conf, last line:
#        include_if_exists = 'F:/Projects/sage_kaizen_ai/config/postgres/sage_kaizen_tuning.conf'
#      Later settings win in PostgreSQL, so the include must come LAST.
#   2. Restart the service (several settings are postmaster-context):
#        Restart-Service postgresql-x64-18
#   3. Verify:  SELECT name, setting, source FROM pg_settings WHERE source = 'configuration file';
#
# Each entry records the value measured on 2026-08-06 so drift is visible.
# =============================================================================


# -----------------------------------------------------------------------------
# MEMORY
# -----------------------------------------------------------------------------

# was: 128MB (default)
# NOT the 25%-of-RAM (48 GB) that the general rule would give.  PostgreSQL's own
# wiki puts the useful range on WINDOWS at 64MB-512MB and warns that large
# values are not effective there, because Windows handles shared memory
# differently and Postgres is better off leaning on the OS file cache.  512MB is
# the top of that range.  Current buffer cache hit ratio is 92%; the target is
# >99%, and most of that gain will come from the OS cache, not from this.
shared_buffers = 512MB

# was: 4MB (default)
# Per sort/hash/materialise NODE, not per query — a plan with several sorts and
# 4 parallel workers can multiply this.  64MB x ~8 active backends x a few nodes
# stays comfortably inside 190 GB, and it stops routine RAG/news/memory queries
# spilling to temp files.  Raise per-session for known-heavy analytics rather
# than raising it globally.
work_mem = 64MB

# was: 64MB (default)
# Global value kept deliberately MODEST: this is also the ceiling for each
# autovacuum worker unless autovacuum_work_mem overrides it, and 3 workers x a
# huge value is a memory spike waiting to happen.  Index builds should raise it
# for their own session instead:
#     SET maintenance_work_mem = '48GB';   -- see scripts/migrate_wiki_chunks_partitioned.py
# That per-session value is what decides whether an HNSW graph builds in RAM
# (minutes) or on disk (days) — see the migration script's partition sizing.
maintenance_work_mem = 2GB

# was: -1 (i.e. "use maintenance_work_mem")
# Pinned so raising maintenance_work_mem for a build session can never be
# inherited by three concurrent autovacuum workers.
autovacuum_work_mem = 1GB

# was: 4GB (default)
# A PLANNER HINT ONLY — allocates nothing.  It tells the planner how much of the
# database the OS is likely caching.  At 4GB on a 190 GB host the planner
# systematically underestimates caching and avoids index plans in favour of
# sequential scans, which on a 3.5 TB table is precisely the wrong choice.
effective_cache_size = 128GB

# was: 8MB (default)
# Per-session temp table buffers; the news and review pipelines use temp tables.
temp_buffers = 64MB


# -----------------------------------------------------------------------------
# PLANNER / IO
# -----------------------------------------------------------------------------

# was: 4 (default) — CORRECT for PGDATA on a 7200 RPM HDD, so left alone.
# Do NOT globally lower this to the usual SSD value of 1.1: the wiki_chunks heap
# and its 2640 GB of TOAST live on spinning disk.  Set it per tablespace instead
# once the vector index moves to NVMe:
#     ALTER TABLESPACE sage_nvme SET (random_page_cost = 1.1, effective_io_concurrency = 200);
random_page_cost = 4.0
seq_page_cost = 1.0

# was: 16 (PostgreSQL 18 default)
# 16 is an SSD-shaped value.  On a SINGLE SPINNING SPINDLE, issuing many
# concurrent prefetch requests causes seek thrashing and makes throughput worse.
# Per-tablespace override raises it for the NVMe index tablespace.
effective_io_concurrency = 2
maintenance_io_concurrency = 2

# was: 100 (default)
# wiki_chunks has 508M rows and has NEVER been analysed (last_analyze IS NULL),
# so the planner is working from statistics that were never gathered.  A higher
# target costs more ANALYZE time but produces usable estimates on a table this
# size.  Run once after applying:  ANALYZE wiki_chunks;
default_statistics_target = 200


# -----------------------------------------------------------------------------
# PARALLELISM  (16 physical cores / 32 threads)
# -----------------------------------------------------------------------------

# was: 8 / 8 / 2 / 2
# Deliberately NOT set to the full thread count.  Three llama-servers, the
# embed services and the ingest workers are competing for the same CPU, and
# aggregate concurrency is one of the named suspects for this rig's crash class
# (ingest CLAUDE.md §18).  Leaving headroom is a stability choice, not a
# throughput oversight.
max_worker_processes = 16
max_parallel_workers = 12
max_parallel_workers_per_gather = 4

# was: 2 (default)
# Used by CREATE INDEX.  NOTE: it does NOT apply to CREATE INDEX CONCURRENTLY,
# which is always single-threaded for the build — one of the reasons the
# migration script builds per-partition indexes non-concurrently on a table
# nothing is reading yet.
max_parallel_maintenance_workers = 4


# -----------------------------------------------------------------------------
# DURABILITY — DO NOT RELAX ON THIS HOST
# -----------------------------------------------------------------------------

# All three are already at their safe defaults.  They are restated explicitly so
# that a future "speed up the ingest" pass has to consciously override a
# commented invariant rather than silently flip an unset default.
#
# With ~9 unclean shutdowns in 7 days, these are what stand between a crash and
# a corrupted 3.5 TB database:
#   fsync            — WAL actually reaches the platter
#   full_page_writes — protects against torn pages, which is the specific
#                      failure a hard reset on an HDD produces
#   data_checksums   — already on (verified); this is what DETECTS such damage
#                      instead of serving silently wrong vectors
fsync = on
full_page_writes = on
synchronous_commit = on


# -----------------------------------------------------------------------------
# WAL
# -----------------------------------------------------------------------------

# was: off.  This build supports pglz / lz4 / zstd (verified via pg_settings).
# lz4 chosen over zstd deliberately: the WAL volume here is dominated by
# full_page_writes on an HDD, so ANY compression is a large I/O win, and lz4
# gets most of the benefit at a fraction of zstd's CPU.  CPU load is a suspect
# in this rig's instability, so the cheaper codec is the safer one.
wal_compression = lz4

# was: 4MB (default, derived from shared_buffers)
wal_buffers = 64MB

# was: 1GB / 80MB (defaults)
# 1GB forces near-constant checkpoints during ingest, and every checkpoint
# triggers a fresh round of full-page writes — brutal on a spinning disk.
#
# NOT raised as far as it could be.  Larger max_wal_size means more WAL to
# replay after each crash, and on this host crashes are routine.  16GB is the
# compromise: roughly a 16x reduction in checkpoint frequency, while keeping
# recovery to minutes rather than tens of minutes.
max_wal_size = 16GB
min_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9


# -----------------------------------------------------------------------------
# AUTOVACUUM
# -----------------------------------------------------------------------------

# was: 200 / 1min (defaults)
# The default cost limit throttles autovacuum to roughly a trickle, which cannot
# keep up with a 508M-row table that is being bulk-inserted into.  Raised so
# vacuum/analyze actually complete; naptime lowered so it notices sooner.
autovacuum_vacuum_cost_limit = 2000
autovacuum_naptime = 30s


# -----------------------------------------------------------------------------
# LOGGING — so the NEXT crash is diagnosable
# -----------------------------------------------------------------------------

# was: -1 / off / -1 / -1 (defaults)
# Right now nothing records what the database was doing when the machine went
# down.  log_checkpoints in particular shows whether a checkpoint storm
# correlates with the crashes, which is a cheap test of the "aggregate load"
# hypothesis in ingest CLAUDE.md §18.
log_min_duration_statement = 5000     # anything over 5 s
log_checkpoints = on
log_autovacuum_min_duration = 0
log_temp_files = 0                    # every spill to disk (work_mem too small)
log_lock_waits = on


# -----------------------------------------------------------------------------
# NOT SET HERE — needs a filesystem move, see docs
# -----------------------------------------------------------------------------
# pg_wal and temp_tablespaces should move to E: (NVMe).  Both are latency
# critical and both currently sit on the HDD behind the 3.5 TB heap.  Moving
# pg_wal requires stopping the service and creating a directory junction, so it
# is a runbook step rather than a config line.  temp_tablespaces is a config
# line but needs the tablespace to exist first:
#     CREATE TABLESPACE sage_temp LOCATION 'E:/pgtemp';
#     temp_tablespaces = 'sage_temp'
