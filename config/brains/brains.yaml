# config/brains/brains.yaml
#
# Single authoritative configuration source for all llama-server instances.
# server_manager.py reads this file directly — no .bat files.
#
# Each brain entry has:
#   - exe:    path to llama-server.exe
#   - model:  path to the GGUF file
#   - log:    path to the log file (--log-file; never stdout/stderr redirect)
#   - server: all llama-server CLI flags grouped by category

# -----------------------------------------------------------------------------
# FAST Brain — Qwen2.5-Omni-7B Q6_K — port 8011
# GPU: Gigabyte GeForce RTX 5090 OC (CUDA1, 32 GB VRAM)
#
# Replaces the former Qwen2.5-14B Q6_K.
# Qwen2.5-Omni supports text, image, and audio input via the --mmproj file.
#
# VRAM budget on CUDA1 (32 GB):
#   Model weights Q6_K:        ~6.25 GB
#   mmproj encoder F16:        ~2.64 GB
#   KV cache q8_0 @ ctx=32768: ~0.90 GB  (28 layers, 4 KV heads, head_dim=128)
#   Compute buffer:            ~0.50 GB
#   Total:                    ~10.3 GB  → ~21.7 GB headroom  ✓
#
# ARCHITECT (Qwen3.6-27B-MTP) on CUDA0 runs simultaneously — no GPU conflict.
# Audio output (TTS) is NOT supported by llama.cpp; responses are text-only.
# Video input: client-side frame extraction → sent as individual images.
# Old model: Qwen2.5-Omni-7B-Q8_0.gguf
# -----------------------------------------------------------------------------
fast:
  exe: "F:/Projects/sage_kaizen_ai/llama.cpp/build/bin/Release/llama-server.exe"
  model: "E:/Qwen2.5-Omni-7B-GGUF/Qwen2.5-Omni-7B-Q6_K.gguf"
  log: "F:/Projects/sage_kaizen_ai/logs/q5_server.log"
  startup_timeout_s: 300    # 5 minutes — 7B model loads quickly on CUDA1

  server:
    host: "127.0.0.1"
    port: 8011

    alias: "Qwen2.5-Omni-7B-Q6_K"

    device: "CUDA1"
    n_gpu_layers: "all"
    split_mode: "none"

    # Combined audio+vision encoder.  Single GGUF holds both the Whisper-style
    # conformer (audio) and the vision transformer (images), identified by the
    # KEY_HAS_AUDIO_ENC and KEY_HAS_VISION_ENC metadata flags.
    # Run install_huggingface.py with the *mmproj*F16* pattern to download it.
    mmproj: "E:/Qwen2.5-Omni-7B-GGUF/mmproj-F16.gguf"

    # 32K context: 1 image ≈ 1280 tokens, leaving ~30K for conversation.
    # Upgraded from 16K — RTX 5090 OC (32 GB) provides ample VRAM headroom (~21.7 GB).
    ctx_size: 32768
    batch_size: 2048          # larger batch improves image-token prefill speed
    ubatch_size: 1024         # 1024 halves GPU kernel dispatch rounds vs 512 during RAG prefill

    threads: 12
    threads_batch: 10
    threads_http: 6

    parallel: 1
    no_kv_unified: true
    no_cont_batching: true

    flash_attn: true
    # q8_0 KV: lossless (<0.1% ppl vs f16) and halves KV read bandwidth vs f16 → better
    # flash-attention throughput for a memory-bound 7B model. f16 would cost +0.9 GB for
    # no perceptible quality gain. bf16 is unsafe on Blackwell SM_120 (CPU fallback).
    cache_type_k: "q8_0"
    cache_type_v: "q8_0"

    # KV prefix cache in host RAM — llama-server stores a copy of the most
    # recently computed KV prefix in system RAM so the next turn that shares
    # the same prefix (system prompt + RAG context) can skip re-prefilling.
    # 512 MiB covers the full system-prompt + a typical RAG injection.
    # Benchmark: ~93% TTFT reduction for cache-hit turns (Discussion #20574).
    cache_ram: 512

    # Lower slot-prompt-similarity threshold → more aggressive KV slot reuse.
    # 0.10 is the llama.cpp default as of b9307; setting explicitly for clarity.
    # 90% of turns will attempt to reuse the nearest slot's cached prefix.
    slot_prompt_similarity: 0.10

    fit: true
    fit_ctx: 32768
    fit_target: 512

    no_warmup: true
    n_predict: -1             # unlimited — multimodal responses vary widely in length

    log_colors: false
    log_timestamps: true
    log_prefix: true
    log_verbosity: 3


# -----------------------------------------------------------------------------
# ARCHITECT Brain — unsloth/Qwen3.6-27B-MTP-GGUF Q6_K — port 8012
# GPU: RTX 5090 (CUDA0, 32 GB VRAM)
#
# Architecture: Hybrid Gated DeltaNet linear attention + full softmax attention
#   (architecture id: qwen35; confirmed via GGUF metadata)
#   - 65 total blocks: 64 transformer layers + 1 MTP prediction head
#   - full_attention_interval=4 → 16/64 layers use KV cache (softmax attention)
#   - 48 layers use fixed recurrent DeltaNet state (no KV cost)
#   - KV cache VRAM cost is ~75% lower than a pure-Transformer model of the same size
#   - 262K native context; model card recommends >= 128K for thinking mode
#
# VRAM budget on CUDA0 (32 GB):
#   Model weights Q6_K:        ~21.3 GB  (22884406400 bytes; +0.3 GB vs non-MTP)
#   MTP head weights:          included above (~310 MB, 1 extra block)
#   KV cache q8_0 @ ctx=131072: ~4.0 GB  (16 KV layers, 4 KV heads, head_dim=256)
#   MTP draft KV cache q8_0:   ~0.05 GB (was f16 ~0.1 GB; quantizable via spec_draft_type_k/v since b9307)
#   Compute buffer:             ~1.5 GB
#   Total (no mmproj):         ~26.85 GB → ~5.15 GB headroom  ✓  (above 2 GB fit_target floor)
#
# MTP heads: 1 (block_count=65 - 64 transformer = 1 MTP head)
# → spec_draft_n_max: 1; expect ~1.4–1.6x speedup at ~80% draft acceptance rate
# -----------------------------------------------------------------------------
architect:
  exe: "F:/Projects/sage_kaizen_ai/llama.cpp/build/bin/Release/llama-server.exe"
  model: "E:/unsloth_Qwen3.6-27B-MTP-GGUF/Qwen3.6-27B-Q6_K.gguf"
  log: "F:/Projects/sage_kaizen_ai/logs/q6_server.log"
  startup_timeout_s: 360    # 6 minutes — 27B model loads; allow extra for mmproj if enabled

  server:
    host: "127.0.0.1"
    port: 8012               # ARCHITECT brain lives on 8012

    alias: "Qwen3.6-27B-MTP-Q6_K"

    # The 27B model runs on the larger GPU
    device: "CUDA0"
    n_gpu_layers: "all"
    split_mode: "none"

    # Multimodal vision encoder — DISABLED: loading mmproj silently disables speculative
    # decoding (draft-mtp), cutting generation throughput significantly. Image/video queries
    # are routed to the FAST brain (Qwen2.5-Omni-7B), which has its own audio+vision mmproj
    # encoder and handles all modalities. Re-enable here only if ARCHITECT-exclusive vision
    # is needed (requires a Qwen3.6-27B-MTP compatible mmproj GGUF).
    # mmproj: ""  # no Qwen3.6-27B-MTP mmproj currently available

    # Context — model trained to 262K; model card requires >= 128K for thinking mode.
    # Only 16/64 transformer layers use KV cache; at 128K q8_0 KV costs ~4 GB (5090 has ~5.15 GB headroom).
    ctx_size: 131072          # 128K — meets model thinking-mode requirement
    batch_size: 2048          # logical batch (llama.cpp default); better prefill throughput
    ubatch_size: 1024         # 1024 halves GPU kernel dispatch rounds vs 512 during RAG prefill

    # 16 threads = physical P-core count on 9950X3D; avoid HT scheduling overhead
    # during GPU-bound decode (DeltaNet forward pass saturates CUDA; CPU threads idle)
    threads: 16
    threads_batch: 16
    threads_http: 8

    parallel: 1

    # With parallel=1 (single slot) there is no benefit to a unified KV buffer
    # shared across sequences.  Disabling it reduces internal bookkeeping and
    # avoids any unified-buffer edge cases with quantized KV caches.
    no_kv_unified: true

    # Continuous batching (dynamic batching) is only useful when more than one
    # sequence runs in parallel.  With parallel=1 it adds overhead with no gain.
    no_cont_batching: true

    flash_attn: true
    # q8_0 KV at 128K ctx costs ~4 GB (16/64 layers use KV; DeltaNet layers use recurrent state).
    # Upgraded from q4_0 (was ~2 GB): q4_0 V cache degrades reasoning quality by ~1.4–1.5 pp;
    # ARCHITECT is exclusively a reasoning/thinking model so lossless KV is worth the 2 GB cost.
    # ~5.15 GB headroom remains after upgrade (above the 2 GB fit_target floor).
    # NOTE: bf16 is unsafe on Blackwell SM_120 — falls back to CPU (100% CPU usage). Use f16/q8_0.
    # Symmetric K+V types required for fused Flash Attention kernels (no asymmetric split).
    cache_type_k: "q8_0"
    cache_type_v: "q8_0"

    # swa_full: intentionally omitted.
    # Qwen3.6-27B's 16 full-attention layers are not SWA (sliding window attention) —
    # they are standard full-context attention.  llama.cpp logs "swa_full is not supported
    # by this model, it will be disabled" at startup; the flag is a no-op for this arch.

    # cache_reuse: intentionally omitted.
    # The MTP draft context logs "cache_reuse is not supported by this context, it will
    # be disabled" at startup.  Re-enable if a future build adds MTP cache_reuse support.

    # Raise server process priority so ARCHITECT turns are not preempted by background tasks.
    prio: 2                   # high (0=normal, 1=medium, 2=high, 3=realtime)

    # KV prefix cache in host RAM — stores the most-recently computed KV prefix
    # so the next turn with the same system-prompt + RAG prefix skips re-prefilling.
    # 256 MiB covers the full system prompt + typical RAG injection.
    cache_ram: 256

    # Aggressive slot-reuse for the single ARCHITECT slot (parallel=1).
    # 0.10 is the llama.cpp default as of b9307; setting explicitly for clarity.
    slot_prompt_similarity: 0.10

    fit: true
    fit_target: 2048  # 2 GB free-VRAM floor; ~5.15 GB actual headroom at q8_0 KV
    fit_ctx: 131072

    no_warmup: true
    n_predict: -1             # unlimited — thinking mode can generate thousands of tokens;
                              # model stops via EOS; clients should set their own max_tokens

    # Thinking mode — Qwen3.6-27B-MTP always runs with <think> enabled on ARCHITECT.
    # Non-thinking fast responses are routed to the FAST brain (Qwen2.5-Omni-7B) by router.py.
    # Model card recommended sampling (thinking mode): temp=0.6, top_k=20, top_p=0.95.
    reasoning: "on"           # explicit thinking mode (--reasoning on); b8639+ flag
    reasoning_budget: -1      # unrestricted thinking depth (--reasoning-budget -1)
    reasoning_format: "deepseek"  # routes <think> tokens to reasoning_content in API
                                  # response, keeping the content field clean for the UI
    # --reasoning-budget-message: only fires when reasoning_budget > 0 (finite).
    # With reasoning_budget=-1 (unlimited) this flag has no effect.
    # Example for a capped-budget setup:
    #   reasoning_budget: 8000
    #   reasoning_budget_message: "Wrap up reasoning and provide the answer."

    # ── Speculative decoding (MTP — built-in prediction heads) ───────────────
    # Qwen3.6-27B contains 1 native MTP head (GGUF confirmed: block_count=65,
    # architecture=qwen35, full_attention_interval=4).  draft-mtp runs this head
    # as part of the main forward pass — no separate model required.
    #
    # Each forward pass produces 2 candidate tokens: the main token + 1 MTP draft.
    # If the draft is accepted (~80% expected) one full LLM call is saved.
    # Expected: ~1.4–1.6x generation throughput increase over baseline.
    #
    # spec_draft_n_max MUST equal the number of MTP heads (1 here).
    # Setting it higher than head count has no effect and is silently ignored.
    #
    # Known issue: llama.cpp #23302 — rare non-deterministic committed token on
    # Qwen3.x MTP models.  Monitor output quality; revert to ngram-map-k below
    # if observed.
    #
    # Fallback config (uncomment + comment above if MTP is unstable):
    # ngram-map-k4v (new in b9307) is an improved variant of ngram-map-k;
    # both are valid alternatives:
    #   spec_type: "ngram-map-k"          # or "ngram-map-k4v" (b9307+)
    #   spec_ngram_map_k_size_n: 5
    #   spec_ngram_map_k_size_m: 48
    #   spec_draft_n_max: 48
    #   spec_draft_n_min: 16
    spec_type: "draft-mtp"
    spec_draft_n_max: 1          # 1 MTP head (block_count 65 = 64 transformer + 1 MTP)
    spec_draft_n_min: 1          # always propose the MTP draft; never skip it

    # Quantize the MTP head's KV cache from f16 → q8_0 (new in b9307).
    # Previously "not configurable"; --spec-draft-type-k/v were added in b9307.
    # Saves ~50% of the MTP draft KV cache VRAM (~0.05 GB vs ~0.1 GB at f16).
    # Draft token sampling (--spec-draft-backend-sampling) is now GPU-accelerated
    # by default in b9307 — no flag needed, free throughput win.
    spec_draft_type_k: "q8_0"
    spec_draft_type_v: "q8_0"

    # ── Prefill checkpoints ───────────────────────────────────────────────────
    # Creates a KV-state snapshot every 4096 tokens during the initial RAG prompt
    # injection (prefill phase).  For a 4–16K RAG prefix this creates 1–4
    # checkpoints; subsequent turns whose prefix matches a checkpoint avoid full
    # reprocessing.  Works correctly alongside swa_full: true.
    #
    # 4096 is intentional — b9307 changed the default to 8192, but 4096 gives
    # more granular checkpoints for our 4–16K RAG prefill window.
    #
    # Issue #20225 note: Qwen3.6-27B's 16 full-attention layers use standard full-context
    # attention (not SWA), so the swa_full workaround is not applicable here.
    # Checkpoints work correctly with this architecture; see swa_full note above.
    checkpoint_every_n_tokens: 4096

    log_colors: false
    log_timestamps: true
    log_prefix: true
    log_verbosity: 3


# -----------------------------------------------------------------------------
# Embedding Server — BGE-M3 FP16 — port 8020
# GPU: RTX 5090 (CUDA0, 32 GB VRAM)
# Shares CUDA0 with ARCHITECT; starts first and stays resident
# -----------------------------------------------------------------------------
embed:
  exe: "F:/Projects/sage_kaizen_ai/llama.cpp/build/bin/Release/llama-server.exe"
  model: "E:/bge-m3-GGUF/FP16/bge-m3-FP16.gguf"
  log: "F:/Projects/sage_kaizen_ai/logs/embed_server.log"
  startup_timeout_s: 300     # 5 minutes — BGE-M3 FP16 loads fast

  server:
    host: "127.0.0.1"
    port: 8020

    alias: "bge-m3-embed"

    # Embedding-specific flags
    embeddings: true          # enable the /embeddings endpoint
    pooling: "mean"           # mean pooling over token embeddings (BGE-M3 standard)

    device: "CUDA0"
    n_gpu_layers: "all"

    # Process scheduling priority (same flag as ARCHITECT).
    # ARCHITECT uses prio: 2 (high); embed gets prio: 1 (medium) so that
    # ARCHITECT generation is never preempted by embedding requests on CUDA0.
    prio: 1

    # BGE-M3 produces 1024-dimensional embeddings.
    # ctx_size should match your ingest chunk size (rag_v1 default: 1200 chars ~ 300 tokens)
    ctx_size: 2048
    batch_size: 512           # must equal ubatch_size for pooling embed servers (llama.cpp b9037+)
    ubatch_size: 512

    threads: 20
    threads_batch: 20
    threads_http: 8

    flash_attn: true

    log_colors: false
    log_timestamps: true
    log_prefix: true
    log_verbosity: 3


# -----------------------------------------------------------------------------
# Wiki Multimodal Embed — jinaai/jina-clip-v2 — port 8031
# GPU: RTX 5090 (CUDA0, 32 GB VRAM)
# Used by both mm_embed_service/app.py (FastAPI) and wiki_ingest.py (batch job)
# -----------------------------------------------------------------------------
wiki_embed:
  # Local directory containing the jina-clip-v2 model weights
  model: "E:/jinaai_jina-clip-v2"

  # Embed service subprocess stdout/stderr log (uvicorn lifecycle messages).
  # NOTE: app.py's Python _LOG (sk_logging) writes to a SEPARATE file:
  #   sage_kaizen_ai_ingest/logs/sage_kaizen_ingest.log
  # sage_wiki_embed.log only contains uvicorn startup/shutdown lines and any
  # raw stderr output (e.g. Python warnings from trust_remote_code).
  # Service B appends to sage_wiki_embed_b.log (log_suffix="_b" applied by
  # wiki_ingest._start_embed_service).
  log: "F:/Projects/sage_kaizen_ai/logs/sage_wiki_embed.log"

  # How long wiki_ingest.py waits for app.py to become healthy on each start.
  # With a warm TORCHINDUCTOR_CACHE_DIR, jina-clip-v2 loads + compiles in ~11 s.
  # Cold first-run (no cache): ~90 s for max-autotune warmup at batch=512.
  # 300 s is ample for a single service starting in isolation.
  #
  # IMPORTANT — concurrent restart deadlock:
  #   Services A (8031) and B (8032) both run on cuda:1.  If both crash
  #   simultaneously and restart concurrently, two AutoModel.from_pretrained()
  #   calls on the same CUDA device can deadlock CUDA's memory allocator,
  #   causing both to hang until this timeout fires.  wiki_ingest.py serialises
  #   restarts per-device via _device_restart_lock() to prevent this.
  startup_timeout_s: 300

  # ── Embed service settings (read by app.py / FastAPI) ──────────────────
  service:
    host: "127.0.0.1"
    port: 8031

    # PyTorch device for the model (CUDA0 = RTX 5090)
    device: "cuda:0"

    # Maximum batch sizes enforced by the service endpoints.
    # wiki_ingest.py uses the same values as its per-call batch size so that
    # ingest calls always stay within the service limits.
    #
    # Throughput note: jina-clip-v2 image encoding has perfectly linear latency
    # scaling with batch size (no GPU parallelism benefit from larger batches —
    # xFormers EVA02-L14 attention tiles sequentially at 512×512 resolution).
    # Throughput scales with concurrent workers, not batch size.
    # text_batch: JinaBERT text encoder benefits greatly from large batches;
    #   512 fills ~17 pages per HTTP call (avg 30 chunks/page) on the 32 GB
    #   RTX 5090 OC (CUDA1), raising GPU matmul utilization from ~50-60%
    #   (batch=256) to ~80-90% (batch=512). Previously 256 on the 16 GB 5080.
    #   wiki_ingest._run_worker accumulates chunks across pages until text_batch
    #   is reached before calling embed_text() — larger batch = fewer HTTP calls.
    # image_batch: optimal range is 4–8; 8 minimises HTTP call overhead while
    #   keeping per-call latency short enough that workers stay responsive.
    #   Image embedding latency scales linearly (no GPU parallelism benefit from
    #   larger batches — EVA02-L14 tiles sequentially at 512×512 resolution).
    text_batch: 512
    image_batch: 8

    # CUDA0 contention guard: after idle_timeout_s seconds of no requests,
    # the service offloads jina-clip-v2 from GPU to CPU (freeing ~2 GB VRAM).
    # On the next request the model is restored to GPU automatically (< 5 s
    # with warm TORCHINDUCTOR_CACHE_DIR; first restore after cold boot: ~15 s).
    # Set to 0 to disable idle offload and keep the model resident on GPU.
    # Override per-session: WIKI_EMBED_IDLE_TIMEOUT_S env var.
    idle_timeout_s: 120

  # ── Verbosity (env var, not a service param) ────────────────────────────
  # WIKI_EMBED_VERBOSE controls how much the embed service writes to its log.
  #
  # Default (0 / unset): quiet mode — only lifecycle milestones are logged
  #   (loading, compiling, warmup, ready, errors).  Suppresses:
  #     - transformers weight-loading progress bars (tqdm)
  #     - flash-attn / xFormers / torch_dtype deprecation warnings
  #     - uvicorn per-request access logs (POST /embed/text 200 OK)
  #
  # Set WIKI_EMBED_VERBOSE=1 to restore full output for debugging:
  #   - All transformers weight-loading progress bars
  #   - All Python warnings
  #   - uvicorn access logs on every request
  #
  # wiki_ingest.py defaults to verbose=1 (progress bars are useful for
  # monitoring long batch ingest jobs).
  # wiki_retriever.py (runtime) defaults to verbose=0.

  # ── Ingest job settings (read by wiki_ingest.py) ───────────────────────
  ingest:
    # Root directory of the extracted Wikipedia ZIM dump (from zim_dump.py) 
    root: "H:/llm_wiki_data"

    # Text chunking parameters
    chunk_chars: 1200   # target chunk size in characters
    overlap: 200        # overlap between consecutive chunks

    # Heading names to exclude from chunking (exact match, case-sensitive)
    exclude_sections: "References,External links,Further reading,Authority control"

    # Progress logging: emit a stats line every N pages
    log_every_pages: 10000


# -----------------------------------------------------------------------------
# Cross-Modal Embed — CLIP + CLAP — dual-modal pipeline
#
# Images → jinaai/jina-clip-v2 (port 8031, reuses wiki embed service)
#            1024-dim cosine vectors → image_embeddings table
#
# Audio  → laion/clap-htsat-unfused (port 8040, CLAP embed service)
#            512-dim cosine vectors → audio_embeddings table
#
# The wiki embed service (port 8031) must be running before image ingest.
# The CLAP service (port 8040) is auto-started by media_ingest.py if needed.
#
# CLAP model: already downloaded to E:/clap-htsat-unfused (local_files_only).
# No HuggingFace download required at service start.
#
# GPU assignment (ARCHITECT brain always on CUDA0/5090):
#   CUDA0 (RTX 5090)    — wiki embed service (jina-clip-v2) + ARCHITECT brain
#   CUDA1 (RTX 5090 OC) — CLAP embed service (audio, freed when FAST brain off)
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Live Web Search — SearXNG private instance
# Running at http://localhost:8080 via Docker Desktop
#
# Router sets needs_search=True on turns that require live data.
# SearchOrchestrator fetches from SearXNG, filters/ranks results, then
# Summarizer calls the FAST brain for a lightweight condensed pass before
# the evidence is injected as a <search_context> block.
#
# All values here are documentation; the live defaults are env-var driven
# (SAGE_SEARCH_* — see search/search_orchestrator.py and search/searxng_client.py).
# Override via .env or shell environment to change at runtime without editing YAML.
# -----------------------------------------------------------------------------
search:
  # Base URL of the private SearXNG Docker instance
  searxng_url: "http://localhost:8080"

  # Per-request HTTP timeout (seconds) — SearXNG fans out to multiple engines
  timeout_seconds: 8

  # Result ceiling per brain — ARCHITECT gets more context headroom (64K ctx)
  max_results:
    fast: 6
    architect: 12

  # Minimum SearXNG score to keep a result.
  # 0.0 = no filter (safe default: SearXNG returns 0.0 for some valid engines).
  min_score: 0.0

  # Snippet truncation — balances context quality vs. token budget.
  snippet_max_chars: 300

  # Default time_range for news-category queries.
  # Accepted values: day | week | month | year | (omit for all-time)
  news_time_range: "week"

  # SearXNG categories used per intent (for documentation; inferred at runtime)
  default_categories:
    - general
    - news
  category_map:
    news:       [news, headlines, breaking, politics, election, current events]
    science:    [arxiv, research paper, scientific study, journal article, nasa discovery]
    technology: [tech news, software release, github release, hardware release, ai news]


# -----------------------------------------------------------------------------
# Voice System — Sage Kaizen AI Voice (sage_kaizen_ai_voice project)
# Authoritative reference for the voice pipeline.
# Runtime config lives at: F:/Projects/sage_kaizen_ai_voice/config/voice.yaml
# Source code lives at:    F:/Projects/sage_kaizen_ai_voice/src/
#
# Integration: voice pipeline CONNECTS to ZMQ sockets; main app BINDS.
# Python version constraint: voice project must use Python 3.11.x (ctranslate2).
# GPU: STT (faster-whisper) runs on CPU; TTS (Kokoro ONNX) runs on CPU.
# -----------------------------------------------------------------------------
voice:
  stt:
    # faster-whisper distil-large-v3.5 INT8 — CPU-only
    model_dir:    "E:/distil-large-v3.5-ct2-int8"
    device:       "cpu"
    compute_type: "int8"
    language:     "en"
    beam_size:    1
    vad_filter:   true
    # Silence gate: 25 chunks × 30 ms = 750 ms endpoint detection
    silence_chunks_to_stop: 25

  tts:
    # Kokoro-82M ONNX (onnx-community/Kokoro-82M-v1.0-ONNX) — CPU-only
    # WARNING: model_q8f16.onnx crashes CPUExecutionProvider — always use model_quantized.onnx
    onnx_model:   "E:/Kokoro-82M-v1.0-ONNX/onnx/model_quantized.onnx"
    voices_dir:   "E:/Kokoro-82M-v1.0-ONNX/voices"
    sample_rate:  24000
    default_voice: "am_onyx"
    default_speed: 0.87
    default_lang:  "en-us"

  personas:
    narrator:
      voice: "am_fenrir"
      speed: 0.87
      use_case: "Creative, philosophy, long-form narration"
    mentor:
      voice: "am_fenrir"
      speed: 0.92
      use_case: "Research, code, architecture, grades 6-9"
    teacher:
      voice: "am_michael"
      speed: 0.95
      use_case: "K-5 tutoring, step-by-step explainers"
    chat:
      voice: "am_fenrir"
      speed: 1.00
      use_case: "Conversational"
    quick:
      voice: "am_onyx"
      speed: 1.05
      use_case: "Device control, status ACKs"

  zmq:
    # Main app BINDS; voice pipeline CONNECTS
    transcript_bus: "tcp://127.0.0.1:5790"   # STT → Main  (PUSH/PULL)
    token_bus:      "tcp://127.0.0.1:5791"   # Main → TTS  (PUB/SUB)
    interrupt_bus:  "tcp://127.0.0.1:5792"   # TTS → Main  (PUSH/PULL)
    # Pi agents use 5800-5810 — no conflict


# -----------------------------------------------------------------------------
# Summarizer Brain — optional lightweight CPU model for search summarization
# GPU: CPU-only (no VRAM cost; runs on Ryzen 9 9950X3D via AVX-512)
#
# Why this exists: search summarization currently calls the FAST brain (8011).
# With parallel=1 on FAST, a summarization sub-call occupies the only slot
# during a live-search turn, blocking the main conversation response until
# summarization finishes.  A dedicated CPU summarizer decouples these paths.
#
# How to activate:
#   1. server_manager.py auto-starts the summarizer brain.
#   2. context_injector.py will automatically prefer the summarizer URL
#      (http://127.0.0.1:8013) over the FAST brain for search summarization.
#
# To force-disable summarization entirely (use raw snippets, zero latency):
#   Set env var: SAGE_SEARCH_SUMMARIZE=false
# -----------------------------------------------------------------------------
summarizer:
  exe: "F:/Projects/sage_kaizen_ai/llama.cpp/build/bin/Release/llama-server.exe"
  # model: "E:/Qwen2.5-3B/qwen2.5-3b-instruct-q8_0.gguf"
  model: "E:/Qwen3-4B-GGUF/Qwen3-4B-Q8_0.gguf"
  log: "F:/Projects/sage_kaizen_ai/logs/summarizer_server.log"
  startup_timeout_s: 120   # small model loads in < 30 s on CPU

  server:
    host: "127.0.0.1"
    port: 8013

    alias: "Qwen3-4B-Summarizer"

    # CPU-only — no VRAM cost.  All CUDA0/CUDA1 headroom preserved for brains.
    n_gpu_layers: 0

    ctx_size: 2048          # summarization prompts are short; 2K is plenty
    batch_size: 512
    ubatch_size: 256

    threads: 8              # 8 physical cores; leaves 8 free for ARCHITECT I/O
    threads_batch: 8
    threads_http: 2

    parallel: 1
    no_kv_unified: true
    no_cont_batching: true

    n_predict: -1
    log_colors: false
    log_timestamps: true
    log_prefix: true
    log_verbosity: 3


media_embed:
  # Local path to the downloaded laion/clap-htsat-unfused model weights.
  # Download: huggingface-cli download laion/clap-htsat-unfused --local-dir E:/clap-htsat-unfused
  clap_model_dir: "E:/clap-htsat-unfused"

  log: "F:/Projects/sage_kaizen_ai/logs/clap_embed_service.log"
  startup_timeout_s: 300    # model load + torch.compile JIT + warmup = ~150-200 s on CUDA1 (RTX 5090 OC)

  # Image embedding — delegates to the always-running wiki embed service.
  image_service:
    host: "127.0.0.1"
    port: 8031              # wiki embed service (jinaai/jina-clip-v2, 1024-dim)
    image_batch: 32         # images per /embed/image call

  # Audio embedding — dedicated CLAP service.
  audio_service:
    host: "127.0.0.1"
    port: 8040              # CLAP embed service (laion/clap-htsat-unfused, 512-dim)
    device: "cuda:1"        # RTX 5090 OC (CUDA1); override via CLAP_DEVICE env var
    audio_batch: 32         # audio files per /embed/audio call
